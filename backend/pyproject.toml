[tool.poetry]
name = "backend"
version = "0.1.0"
description = "AI Job Agent Backend"
authors = ["Parag <parag@example.com>"]
readme = "README.md"
packages = [{include = "backend"}]

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
sqlalchemy = "^2.0.0"
asyncpg = "^0.29.0"
langchain = "^0.1.0"
langgraph = "^0.0.20"
openai = "^1.3.0"
pinecone-client = "^2.2.4"
redis = "^5.0.1"
celery = "^5.3.4"
playwright = "^1.40.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.0.0"
pypdf = "^3.17.0"
python-docx = "^1.1.0"

[tool.poetry.group.dev.dependencies]
black = "^23.11.0"
ruff = "^0.1.0"
pytest = "^7.4.3"

[tool.poetry.scripts]
start = "uvicorn main:app --host 0.0.0.0 --port 8000"
dev = "uvicorn main:app --reload --host 0.0.0.0 --port 8000"
test = "pytest"
lint = "ruff ."

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"